services:
  - type: web
    name: witching-hour
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install .
    startCommand: uvicorn witching_hour.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: WH_DATA
        value: demo_data
      # The public demo never runs a model on visitors' questions: it replays results.
      - key: WH_LIVE
        value: "0"
