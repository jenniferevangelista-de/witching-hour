services:
  - type: web
    name: witching-hour
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install .
    startCommand: uvicorn witching_hour.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: WH_DATA
        value: demo_data
      # The house's agent replays recorded hunts on the public demo (a house's logs are private).
      - key: WH_LIVE
        value: "0"
      # The spirit board answers live with Gemma 3 27B through Backboard when this key is set
      # (in the Render dashboard, never in the repo); without it the board uses template answers.
      - key: BACKBOARD_API_KEY
        sync: false
