[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "witching-hour"
version = "0.1.0"
description = "What happened in the house at 3 AM? TabPFN learns what was normal, Gemma tells the story, every sentence cites a sensor."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jennifer Evangelista" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "requests>=2.31",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
tabpfn = ["tabpfn>=9.2,<10", "lightgbm>=4.4"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
witching-hour = "witching_hour.cli:main"

[tool.setuptools.packages.find]
include = ["witching_hour*"]

[tool.setuptools.package-data]
witching_hour = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
