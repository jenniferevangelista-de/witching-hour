# Fine-tune a small open model on Tinker to speak as the crew without inventing numbers,
# then score base vs tuned on held-out (later) nights with the demo's own validator.
name: tinker

on:
  workflow_dispatch:
    inputs:
      narrate_run_id:
        description: "narrate run whose stories-* artifacts are the training data"
        required: true
      haunt_run_id:
        description: "haunt run whose scan-* artifacts hold the nights"
        default: "40656271313"
      split:
        description: "nights before this date train, nights from it on are held out"
        default: "2016-04-15"

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: "1"
  TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}

jobs:
  tinker:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e . tinker tinker-cookbook
      - uses: actions/download-artifact@v4
        with:
          pattern: scan-*
          merge-multiple: true
          path: demo_data
          run-id: ${{ inputs.haunt_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: stories-*
          merge-multiple: true
          path: demo_data/stories
          run-id: ${{ inputs.narrate_run_id }}
          github-token: ${{ github.token }}
      - run: witching-hour index --out demo_data
      - run: python train/make_sft.py demo_data train/out ${{ inputs.split }}
      - name: Base model on held-out nights
        run: python train/tinker_eval.py demo_data train/out
      - name: LoRA fine-tune on Tinker
        run: python train/tinker_sft.py train/out
      - name: Fine-tuned model on held-out nights
        run: |
          SAMPLER=$(python -c "import json;rows=[json.loads(l) for l in open('train/out/run/checkpoints.jsonl')];print([r for r in rows if r.get('name')=='final'][-1]['sampler_path'])")
          echo "$SAMPLER" > train/out/sampler_path.txt
          python train/tinker_eval.py demo_data train/out "$SAMPLER"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tinker
          path: |
            train/out/*.json
            train/out/*.txt
            train/out/run/metrics.jsonl
            train/out/run/checkpoints.jsonl
          retention-days: 14
