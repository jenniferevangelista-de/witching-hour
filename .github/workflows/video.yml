# The two videos: the crew's film (narrated by the characters) and a real tour of the app.
name: video

on:
  workflow_dispatch:
    inputs:
      which:
        description: "film, tour or both"
        default: "both"

permissions:
  contents: read

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libcairo2
          pip install -e . playwright edge-tts pillow numpy cairosvg
          python -m playwright install --with-deps chromium
      - name: Start the app (demo mode)
        run: |
          (WH_LIVE=0 witching-hour serve --data demo_data --port 8000 > server.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 1; done
      - name: Make the videos
        run: python video/make_videos.py http://127.0.0.1:8000 video/out "${{ inputs.which }}"
      - name: Inspect video and audio
        run: python video/qa_media.py video/out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: videos
          path: |
            video/out/*.mp4
            video/out/*.srt
            video/out/qa_*.json
            video/out/qa_*.jpg
            video/out/qa_*.mp3
          retention-days: 14
