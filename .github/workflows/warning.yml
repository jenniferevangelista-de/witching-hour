# "The Warning": render the staged demo recording, investigate it with OpenCV,
# then summon a fictional spirit with Gemma and record a Ouija session.
name: warning

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Ollama model"
        default: "gemma4:e4b"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  WH_ENV: github-actions
  WH_LLM: ollama

jobs:
  warning:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -e ".[tracing]" pillow opencv-python-headless
      - name: Render the staged recording
        run: python demo/make_warning.py demo/out
      - name: Investigate it (OpenCV + audio)
        run: witching-hour footage demo/out/the_warning.mp4 --out demo/out/the_warning.json --title "The Warning"
      - name: Start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          if ! curl -sf http://127.0.0.1:11434/api/tags >/dev/null; then (ollama serve > ollama.log 2>&1 &); fi
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 2; done
          ollama pull ${{ inputs.model }}
      - name: The séance
        env:
          WH_MODEL: ${{ inputs.model }}
        run: witching-hour seance --case demo/out/the_warning.json --questions "Is someone here?|Who are you?|What were you trying to say?|Why did you knock?|Will you come back?"
      - name: Keep three stills
        run: for s in 4 9.4 10.2; do ffmpeg -y -loglevel error -ss $s -i demo/out/the_warning.mp4 -frames:v 1 demo/out/still_$s.png; done
      - uses: actions/upload-artifact@v4
        with:
          name: warning
          path: |
            demo/out/the_warning.mp4
            demo/out/the_warning.json
            demo/out/still_*.png
          retention-days: 14
